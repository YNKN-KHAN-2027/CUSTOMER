 <path d="M80 54C54 24 52 4 80 4s26 20 0 50" fill="none" stroke="${a.kraft?"#8a6a43":"#9aa7b6"}" stroke-width="2.5"/>
 <path d="M${x+14} 28h${(w-14)*2}l14 14v146a8 8 0 0 1-8 8H${x+8}a8 8 0 0 1-8-8V42z" fill="${body}" stroke="rgba(20,38,61,.2)"/>
 <path d="M${x+14} 28h${(w-14)*2}l14 14H${x}z" fill="${band}"/><path d="M${x} 42h${w*2}v8H${x}z" fill="${band}"/>
 <circle cx="80" cy="42" r="6" fill="${a.kraft?"#c9a173":"#eceffa"}" stroke="rgba(20,38,61,.35)"/>
 <text x="80" y="96" text-anchor="middle" font-family="IBM Plex Sans,Arial" font-weight="700" font-size="20" fill="${tx}">BRAND</text>

 <rect x="${58}" y="120" width="44" height="3" rx="1.5" fill="${tx}" opacity=".35"/><rect x="${62}" y="128" width="36" height="3" rx="1.5" fill="${tx}" opacity=".35"/>${bars}</svg>`;
}

let lang="en",tab="all";
try{const sv=localStorage.getItem("cl_lang");if(sv==="ar"||sv==="en")lang=sv}catch(e){}
const T=k=>L[lang][k],I=lang==="ar"?1:0;
const $=s=>document.querySelector(s);
const nm=p=>p.n[lang==="ar"?1:0];

Object.assign(L.en,{add:"Add to cart",qty:"Qty",s2:"Add to your cart",s2d:"Choose size, material, finish and quantity for each product.",s3:"Confirm your order",s3d:"Send it to us. We contact you to confirm the price and timing, then print.",

Object.assign(L.ar,{add:"أضف للسلة",qty:"الكمية",s2:"ضيف للسلة",s2d:"اختار المقاس والخامة والتشطيب والكمية لكل منتج.",s3:"أكد طلبك",s3d:"ابعته لينا وهنكلمك نأكد السعر والمعاد وبعدها نطبع.",
 cT:"السلة",cS:"راجع طلبك وضيف بياناتك وأكد. مفيش دفع دلوقتي.",fN:"اسمك",fP:"رقم التليفون / واتساب",fE:"الإيميل (اختياري)",fA:"العنوان / الشركة (اختياري)",fNo:"ملاحظات (اختياري)",confirm:"تأكيد الطلب",empty:"السلة فاضية. ضيف منتجات من فوق.",need:"من فضلك اكتب اسمك ورقم تليفون صحيح.",
 thx:"استلمنا طلبك",thxD:"هنكلمك قريب نأكد السعر والتسليم. كود طلبك:",wa2:"ابعته كمان على واتساب",again:"طلب جديد",sz:"المقاس",mt:"الخامة",fi:"التشطيب",
 wmsg:(r)=>`مرحبا Royal Print، عملت طلب (${r.code}).\nالاسم: ${r.c.name}\n`+r.items.map(i=>`- ${i.name} ${i.size} ${i.mat} ${i.fin} x${i.qty}`).join("\n")});
Object.assign(L.en,{fail:"Could not send your order. Check your connection and try again, or contact us on WhatsApp.",busy:"Too many attempts. Please wait a few minutes."});Object.assign(L.ar,{fail:"معرفناش نبعت الطلب. اتأكد من الإنترنت وجرب تاني، أو كلمنا على واتساب.",busy:"محاولات كتير. استنى كام دقيقة وجرب تاني."});
const BR={url:"https://api.baserow.io",table:1332623,token:""}/* paste the customer-form token between the quotes */,API=!!BR.token,IK="ceaser_requests_v1";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let cart=[];try{cart=JSON.parse(localStorage.getItem("cl_cart")||"[]").filter(x=>P.some(p=>p.id===x.pid))}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cl_cart",JSON.stringify(cart))}catch(e){}};
const szT=(v,ar)=>v.includes("×")?v+" cm":(ar?"شكل مخصص":v);

function render(){
 const ar=lang==="ar",u=a=>a.filter((v,i,x)=>x.indexOf(v)===i);
 document.documentElement.lang=lang;document.documentElement.dir=ar?"rtl":"ltr";
 $("#lang").textContent=ar?"English":"العربية";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
 $("#hwa").href="https://wa.me/"+PHONE;
 $("#tabs").innerHTML=[["all",T("all")],["stk",T("stk")],["tag",T("tag")]].map(([k,t])=>`<button class="tab ${tab===k?"on":""}" data-k="${k}">${t}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});
 $("#grid").innerHTML=P.filter(p=>tab==="all"||p.k===tab).map(p=>`<article class="card"><div class="art">${art(p)}</div><div class="body">
  <div class="kind">${p.k==="stk"?T("stk"):T("tag")}</div><h3>${nm(p)}</h3><p>${p.d[ar?1:0]}</p>
  <div class="pick"><div><label>${T("sz")}</label><select class="zs">${u(p.sz).map(v=>`<option value="${v}">${szT(v,ar)}</option>`).join("")}</select></div>
  <div><label>${T("mt")}</label><select class="zm">${p.m.map(v=>`<option value="${v}">${ar?(MAT[v]||v):v}</option>`).join("")}</select></div>
  <div><label>${T("fi")}</label><select class="zf">${p.f.map(v=>`<option value="${v}">${ar?(FIN[v]||v):v}</option>`).join("")}</select></div>
  <div><label>${T("qty")}</label><input class="zq" type="number" min="1" value="1000"></div></div>
  <button class="btn s" data-id="${p.id}">${T("add")}</button></div></article>`).join("");
 document.querySelectorAll(".card .btn").forEach(b=>b.onclick=()=>{
  const cd=b.closest(".card"),p=P.find(x=>x.id===b.dataset.id);
  cart.push({id:uid(),pid:p.id,name:p.n[0],k:p.k,size:cd.querySelector(".zs").value,mat:cd.querySelector(".zm").value,fin:cd.querySelector(".zf").value,qty:Math.max(1,+cd.querySelector(".zq").value||1)});
  saveCart();drawCart();b.textContent="✓ "+cart.length;setTimeout(()=>b.textContent=T("add"),900)});
 $("#steps").innerHTML=[1,2,3].map(i=>`<div class="step"><b>${i}</b><h3 style="margin:4px 0">${T("s"+i)}</h3><p style="margin:0;color:var(--mute)">${T("s"+i+"d")}</p></div>`).join("");
 drawCart();
}
function drawCart(){
 const ar=lang==="ar";$("#cc").textContent="🛒 "+cart.length;
 $("#cl").innerHTML=cart.length?cart.map(c=>{const p=P.find(x=>x.id===c.pid);return`<div class="crow"><div><b>${nm(p)}</b><div class="meta">${szT(c.size,ar)} · ${ar?(MAT[c.mat]||c.mat):c.mat} · ${ar?(FIN[c.fin]||c.fin):c.fin}</div></div><input type="number" min="1" value="${c.qty}" data-q="${c.id}" aria-label="${T("qty")}"><button class="btn g s" data-r="${c.id}" aria-label="remove">×</button></div>`}).join(""):`<div class="note" style="margin:0">${T("empty")}</div>`;
 $("#cl").querySelectorAll("[data-q]").forEach(i=>i.onchange=()=>{const c=cart.find(x=>x.id===i.dataset.q);c.qty=Math.max(1,+i.value||1);i.value=c.qty;saveCart()});
 $("#cl").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.r);saveCart();drawCart()});
}
async function submit(){
 const m=$("#fm"),n=$("#fn").value.trim(),ph=$("#fp").value.trim();m.textContent="";
 if(!cart.length){m.textContent=T("empty");return}
 if(!n||ph.replace(/\D/g,"").length<8){m.textContent=T("need");return}
 const r={id:uid(),code:"R"+Date.now().toString(36).slice(-5).toUpperCase(),at:new Date().toISOString(),status:"new",lang,
  c:{name:n,phone:ph,email:$("#fe").value.trim(),addr:$("#fa").value.trim(),notes:$("#fno").value.trim()},
  items:cart.map(({pid,name,k,size,mat,fin,qty})=>({pid,name,k,size,mat,fin,qty}))};
 $("#cgo").disabled=true;$("#cgo").textContent="...";let ok=false;
 if($("#hp").value)ok=true;
 else if(API){try{const x=await fetch(BR.url+"/api/database/rows/table/"+BR.table+"/?user_field_names=true",{method:"POST",headers:{Authorization:"Token "+BR.token,"Content-Type":"application/json"},body:JSON.stringify({Code:r.code,Name:r.c.name,Phone:r.c.phone,Email:r.c.email,Address:r.c.addr,Notes:r.c.notes,Status:"new",Lang:lang,Items:JSON.stringify(r.items)})});ok=x.ok}catch(e){}}
 else{try{const a=JSON.parse(localStorage.getItem(IK)||"[]");a.push(r);localStorage.setItem(IK,JSON.stringify(a));ok=true}catch(e){}}
 $("#cgo").disabled=false;$("#cgo").textContent=T("confirm");
 if(!ok){if(!m.textContent)m.textContent=T("fail");return}
 cart=[];saveCart();drawCart();
 $("#cbox").hidden=true;const d=$("#done");d.hidden=false;
 d.innerHTML=`<h2 style="margin-top:0">✓ ${T("thx")}</h2><p>${T("thxD")} <b dir="ltr">${r.code}</b></p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${PHONE}?text=${encodeURIComponent(L[lang].wmsg(r))}">${T("wa2")}</a> <button class="btn g" id="again">${T("again")}</button>`;
 $("#again").onclick=()=>{d.hidden=true;$("#cbox").hidden=false;["#fn","#fp","#fe","#fa","#fno"].forEach(s=>$(s).value="")};
}
$("#cgo").onclick=submit;
$("#lang").onclick=()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("cl_lang",lang)}catch(e){}render()};

/* Products added from the dashboard (Baserow "Products" table) */
const CAT={table:1334514}; // put the Products table id here (same number as BRP in index.html)
function rowToP(w){
 const sp=s=>String(s||"").split(/[,،]/).map(x=>x.trim()).filter(Boolean),tag=w.Kind==="tag",st=w.Style||"";
 const art=tag?{c:w.Color||"#141b4d",w:w.Shape==="wide"?1.15:1,kraft:st==="kraft"?1:0,foil:st==="foil"?1:0}:{s:w.Shape||"rect",c:w.Color||"#2b3a9e",clear:st==="transparent"?1:0};
 const sz=sp(w.Sizes),m=sp(w.Materials),f=sp(w.Finishes);
 return{id:"b"+w.id,k:tag?"tag":"stk",art,n:[w.Name,w.NameAr||w.Name],d:[w.Description||"",w.DescriptionAr||w.Description||""],sz:sz.length?sz:["Custom shape"],m:m.length?m:["Glossy paper"],f:f.length?f:["Varnish"]};
}
async function loadCat(){
 if(!CAT.table||!BR.token)return;
 try{const r=await fetch(BR.url+"/api/database/rows/table/"+CAT.table+"/?user_field_names=true&size=200",{headers:{Authorization:"Token "+BR.token}});if(!r.ok)return;
  const j=await r.json();let n=0;(j.results||[]).filter(w=>w.Name&&String(w.Active).toLowerCase()!=="no").forEach(w=>{if(!P.some(x=>x.id==="b"+w.id)){P.push(rowToP(w));n++}});if(n)render()}catch(e){}
}
render();
loadCat();
</script>
